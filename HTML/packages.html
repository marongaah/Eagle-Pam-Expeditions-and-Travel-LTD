<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/images/egfavicon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/assets/images/egfavicon.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safari Packages | Eagle Pam Expeditions</title>
    <meta name="description" content="Explore Kenya safaris, Kenya and Tanzania wildlife adventures, and Mount Kenya trekking packages with Eagle Pam Expeditions.">
    <meta name="theme-color" content="#163f24">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- packages.css is replaced by the new stylesheet below -->
    <link rel="stylesheet" href="../assets/css/packages.css">
</head>

<body data-base="../">

    <div id="navbar"></div>

    <main class="pk-page">

        <h1 class="pk-sr-only">Safari and trekking packages in Kenya and Tanzania</h1>

        <!-- ========== SEARCH BAR + QUICK CHIPS ========== -->
        <section class="pk-top" aria-label="Search packages">
            <div class="pk-wrap">

                <form id="pkSearchForm" class="pk-search" role="search" autocomplete="off">
                    <label class="pk-search-field pk-search-where">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
                        <span class="pk-sr-only">Where to?</span>
                        <input type="search" id="pkWhere" list="pkPlaces" placeholder="Where to? Mara, Amboseli, Serengeti…">
                        <datalist id="pkPlaces">
                            <option value="Masai Mara"></option>
                            <option value="Amboseli"></option>
                            <option value="Lake Nakuru"></option>
                            <option value="Samburu"></option>
                            <option value="Mount Kenya"></option>
                            <option value="Serengeti"></option>
                            <option value="Ngorongoro"></option>
                            <option value="Tanzania"></option>
                        </datalist>
                    </label>

                    <label class="pk-search-field pk-search-length">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        <span class="pk-sr-only">Trip length</span>
                        <select id="pkLength">
                            <option value="all">Any length</option>
                            <option value="short">2 – 4 days</option>
                            <option value="mid">5 – 7 days</option>
                            <option value="long">8+ days</option>
                        </select>
                    </label>

                    <button type="submit" class="pk-search-btn">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        Update
                    </button>
                </form>

                <div class="pk-chips" id="pkChips" role="group" aria-label="Quick filters"></div>
            </div>
        </section>

        <!-- ========== SIDEBAR + RESULTS ========== -->
        <div class="pk-wrap pk-layout">

            <aside class="pk-sidebar" id="pkSidebar" aria-label="Filters">
                <button type="button" class="pk-sidebar-toggle" id="pkSidebarToggle" aria-expanded="false">Filters</button>

                <div class="pk-sidebar-body">
                    <div class="pk-sidebar-head">
                        <h2>Filters</h2>
                        <button type="button" class="pk-clear" id="pkClear">Clear all</button>
                    </div>

                    <div class="pk-filter-group">
                        <h3>Destination</h3>
                        <div id="pkDestList" class="pk-radio-list"></div>
                    </div>

                    <div class="pk-filter-group">
                        <button type="button" class="pk-group-toggle" aria-expanded="true" data-target="pkInterestList">
                            <h3>Interests</h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
                        </button>
                        <div id="pkInterestList" class="pk-check-list"></div>
                    </div>
                </div>
            </aside>

            <section class="pk-results" aria-label="Packages">

                <div class="pk-results-bar">
                    <p id="pkCount" class="pk-count" aria-live="polite"></p>
                    <label class="pk-sort">
                        <span>Sort by</span>
                        <select id="pkSort">
                            <option value="recommended">Recommended</option>
                            <option value="price-asc">Price: low to high</option>
                            <option value="price-desc">Price: high to low</option>
                            <option value="days-asc">Duration: shortest</option>
                            <option value="days-desc">Duration: longest</option>
                        </select>
                    </label>
                </div>

                <div id="pkGrid" class="pk-grid"></div>

                <p id="pkEmpty" class="pk-empty" hidden>
                    No packages match your search. Try another keyword or
                    <button type="button" id="pkEmptyReset">clear the filters</button>.
                </p>

                <p id="pkRange" class="pk-range" aria-live="polite"></p>
                <nav id="pkPager" class="pk-pager" aria-label="Pagination"></nav>
            </section>
        </div>
    </main>

    <div id="footer"></div>

    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/packages-listing.js"></script>

</body>
</html>
